<!DOCTYPE html>
<html lang="pl" class="auth-pending">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>LEAP — panel koordynatorów</title>
  <meta name="description" content="Prosty panel kontroli i decyzji koordynatorów projektu LEAP." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="portal-simple.css?v=20260805-3" />
</head>
<body>
  <header class="simple-header">
    <a class="simple-brand" href="portal-start.html?v=20260805-3"><span aria-hidden="true">L</span>LEAP</a>
    <div class="header-actions">
      <a class="header-action-primary" href="portal-coordinator-edit.html?v=20260805-3">Wprowadź zmianę</a>
      <a class="quiet-link" href="portal-glossary.html?v=20260805-3">Słowniczek</a>
      <a class="quiet-link" href="portal-start.html?v=20260805-3">Wybór panelu</a>
      <button class="quiet-button" id="coordinatorLock" type="button">Zablokuj panel</button>
    </div>
  </header>

  <main class="simple-main">
    <header class="simple-intro">
      <div>
        <p class="eyebrow">Tylko kontrola i decyzje</p>
        <h1>Panel koordynatorów</h1>
        <p>Bartosz i Magda widzą tutaj wyłącznie sprawy, które wymagają przygotowania, reakcji albo decyzji.</p>
      </div>
    </header>
    <p class="sync-status" id="coordinatorSyncStatus" role="status" aria-live="polite"></p>

    <div class="simple-grid">
      <section class="simple-card card-wide card-blue">
        <div class="card-heading"><h2>Najbliższy dzień badawczy</h2><small id="coordinatorReadiness"></small></div>
        <div id="coordinatorNextDay"></div>
      </section>

      <section class="simple-card">
        <div class="card-heading"><h2>Zadania wymagające reakcji</h2><small id="coordinatorTaskCount"></small></div>
        <ul class="plain-list" id="coordinatorTasks"></ul>
      </section>

      <section class="simple-card card-sand">
        <div class="card-heading"><h2>Problemy do decyzji</h2><span class="decision-count" id="coordinatorDecisionCount"></span></div>
        <ul class="plain-list" id="coordinatorDecisions"></ul>
      </section>

      <section class="simple-card card-wide card-sage">
        <div class="card-heading"><h2>Braki danych</h2><small id="coordinatorQueryCount"></small></div>
        <ul class="plain-list" id="coordinatorQueries"></ul>
      </section>
    </div>
  </main>

  <script src="portal-data.js?v=20260805-3"></script>
  <script src="portal-sync-config.js?v=20260805-3"></script>
  <script src="portal-store.js?v=20260805-3"></script>
  <script src="portal-coordinator.js?v=20260805-3"></script>
</body>
</html>
